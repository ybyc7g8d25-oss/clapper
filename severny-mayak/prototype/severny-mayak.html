<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Северный маяк — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=PT+Mono&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --outer:#05040a;
  --grape:#5a3db8; --grape-hi:#8e72f2; --grape-lo:#34207a;
  --mint:#3fbf86; --mint-hi:#8ee6bb; --mint-lo:#1f8a5a;
  --ink:#1d1a2b; --win:#eef2f7; --line:#b9c2d0; --alert:#c9372f;
  --tray:#2f6fb8;
  --sys:Tahoma, Verdana, "Segoe UI", Arial, sans-serif;
  --mono:"PT Mono","Courier New",monospace;
  --pix:"Press Start 2P","Courier New",monospace;
  --kid:"Caveat","Comic Sans MS","Segoe Print",cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --outer:#05040a; } }
:root[data-theme="dark"]{ --outer:#05040a; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--outer);font-family:var(--sys);font-size:13px;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit}
:focus-visible{outline:2px dashed #fff;outline-offset:2px}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#screen{position:absolute;inset:0;transition:filter 3s ease}
body[data-stage="1"] #screen{filter:saturate(.72) brightness(.97)}
body[data-stage="2"] #screen{filter:saturate(.35) contrast(1.08) brightness(.82)}
body[data-stage="3"] #screen{filter:saturate(.22) sepia(.35) hue-rotate(-25deg) contrast(1.2) brightness(.66)}
#screen.glitch{animation:gl .28s steps(3) 1}
@keyframes gl{0%{transform:translate(6px,-2px) skewX(2deg)}33%{transform:translate(-8px,3px)}66%{transform:translate(3px,0) skewX(-3deg)}100%{transform:none}}

/* wallpaper */
#wall{position:absolute;inset:0 0 40px 0}
#wall svg{width:100%;height:100%;display:block}
.wp-boy,.wp-bot,.wp-scratch,.wp-glow{transition:opacity 4s ease, fill 4s ease}
.wp-scratch{opacity:0}
.wp-light{transition:fill 3s}
body[data-stage="2"] #wall .wp-boy{opacity:.45}
body[data-stage="3"] #wall .wp-boy{opacity:0}
body[data-stage="3"] #wall .wp-scratch{opacity:1}
body[data-stage="3"] .wp-light{fill:#ff2a2a}
body[data-stage="3"] .wp-glow{opacity:.2}
body[data-stage="2"] .wp-sun circle,body[data-stage="3"] .wp-sun circle{fill:#bdb6a0}

/* icons */
#icons{position:absolute;top:10px;left:8px;bottom:50px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,94px);gap:2px 6px;align-content:start}
.icon{width:86px;height:92px;border:1px solid transparent;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;cursor:default;border-radius:3px;color:#fff}
.icon svg{width:40px;height:40px;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.35))}
.icon span{font-size:12px;line-height:1.2;text-align:center;text-shadow:1px 1px 1px #000,0 0 3px #000;word-break:break-word;padding:1px 3px;border-radius:2px}
.icon.sel span{background:var(--grape)}
.icon.sel{border:1px dotted rgba(255,255,255,.7)}
.icon.new::after{content:"";position:absolute}

/* windows */
#windows{position:absolute;inset:0 0 40px 0;pointer-events:none}
.win{position:absolute;pointer-events:auto;background:var(--win);border:3px solid var(--grape);border-top:0;border-radius:8px 8px 3px 3px;box-shadow:5px 6px 0 rgba(0,0,0,.28);display:flex;flex-direction:column;min-width:220px;overflow:hidden;animation:pop .14s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.tb{height:28px;flex:none;background:linear-gradient(180deg,var(--grape-hi),var(--grape) 45%,var(--grape-lo));display:flex;align-items:center;gap:6px;padding:0 4px 0 7px;color:#fff;font-weight:bold;cursor:move;touch-action:none}
.tb .ic svg,.task .ic svg{width:16px;height:16px;display:block}
.tb .t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:1px 1px 0 #25145c}
.tb button{width:22px;height:21px;border:1px solid #fff;border-radius:4px;background:linear-gradient(#a58ff7,#5a3db8);color:#fff;font:bold 12px var(--sys);cursor:pointer;padding:0;line-height:1}
.tb button.x{background:linear-gradient(#f4987f,#c9372f)}
.win.inactive .tb{filter:saturate(.35) brightness(1.15)}
.wb{flex:1;overflow:auto;position:relative;user-select:text;-webkit-user-select:text}
.menu-strip{display:flex;gap:14px;padding:3px 8px;border-bottom:1px solid var(--line);background:#f7f9fc;font-size:12px;color:#444}

/* taskbar */
#bar{position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(180deg,var(--grape-hi) 0,var(--grape) 14%,var(--grape-lo));display:flex;align-items:center;gap:6px;z-index:9000}
#startBtn{height:100%;padding:0 20px 0 12px;border:0;border-radius:0 16px 16px 0;background:linear-gradient(180deg,var(--mint-hi),var(--mint) 42%,var(--mint-lo));color:#fff;font:bold italic 16px var(--sys);text-shadow:1px 1px 0 #145c3b;cursor:pointer;display:flex;align-items:center;gap:7px;box-shadow:2px 0 4px rgba(0,0,0,.3)}
#startBtn svg{width:20px;height:20px}
#tasks{flex:1;display:flex;gap:4px;overflow:hidden;min-width:0}
.task{max-width:170px;min-width:0;height:29px;border:1px solid rgba(255,255,255,.35);border-radius:3px;background:rgba(255,255,255,.14);color:#fff;font:12px var(--sys);padding:0 8px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.task span:last-child{overflow:hidden;text-overflow:ellipsis}
.task.on{background:rgba(0,0,0,.28);box-shadow:inset 1px 1px 3px rgba(0,0,0,.5)}
.task.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:#e89b2c}}
#tray{height:100%;display:flex;align-items:center;gap:10px;padding:0 12px;background:linear-gradient(180deg,#5aa8e8,var(--tray));border-left:1px solid #1b4f8f;color:#fff;font-size:12px}
#tray button{background:none;border:0;padding:0;cursor:pointer;display:flex}
#tray svg{width:16px;height:16px}

/* start menu */
#menu{position:absolute;left:0;bottom:40px;width:250px;background:#fff;border:3px solid var(--grape);border-radius:8px 8px 0 0;z-index:9100;display:none;box-shadow:4px -2px 0 rgba(0,0,0,.25);overflow:hidden}
#menu.open{display:block}
#menu .head{background:linear-gradient(180deg,var(--grape-hi),var(--grape));color:#fff;padding:10px 12px;font-weight:bold;font-size:15px;display:flex;align-items:center;gap:10px}
#menu .head svg{width:36px;height:36px;background:#fff;border-radius:4px;border:2px solid #fff}
#menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 12px;text-align:left;font-size:13px;cursor:pointer;color:var(--ink)}
#menu button:hover,#menu button:focus-visible{background:var(--grape);color:#fff;outline:none}
#menu button svg{width:24px;height:24px}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* pixel companion */
#pix{position:absolute;right:12px;bottom:52px;z-index:9500;display:flex;align-items:flex-end;gap:8px;max-width:min(430px,calc(100% - 24px));pointer-events:none;opacity:0;transition:opacity .6s}
#pix.show{opacity:1}
#bubble{pointer-events:auto;background:#fff;border:2px solid var(--ink);border-radius:10px 10px 2px 10px;padding:9px 12px 8px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;min-width:160px}
#bubble .who{font:9px/1 var(--pix);color:var(--grape);margin-bottom:7px;display:flex;justify-content:space-between;gap:10px}
#bubble .who i{font-style:normal;color:#999}
#btext{font:14px/1.45 var(--mono);min-height:20px;white-space:pre-wrap}
#goal{font:11px/1.35 var(--sys);color:#556;margin-top:7px;border-top:1px dashed #bbb;padding-top:5px}
#goal:empty{display:none}
#avatar{width:64px;height:64px;flex:none;pointer-events:auto}
#avatar svg{width:100%;height:100%;display:block}
#avatar.talk{animation:bob .3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
body[data-stage="2"] #bubble{background:#ececec;color:#2a2a2a}
body[data-stage="3"] #bubble{background:#0d0b10;color:#ff5a4d;border-color:#ff5a4d;box-shadow:3px 3px 0 #7a1510}
body[data-stage="3"] #bubble .who{color:#ff5a4d}
body[data-stage="3"] #goal{color:#b8544b;border-color:#5a1b16}

/* fx */
#fx{position:absolute;inset:0;pointer-events:none;z-index:9400}
#fx div{position:absolute;inset:0;opacity:0;transition:opacity 3s}
.scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
.vig{background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.75))}
.noise{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:nz .4s steps(4) infinite}
@keyframes nz{0%{background-position:0 0}25%{background-position:-60px 30px}50%{background-position:40px -70px}75%{background-position:-20px 90px}}
#fx .flash{background:#fff;transition:none}
body[data-stage="1"] #fx .vig{opacity:.3}
body[data-stage="2"] #fx .vig{opacity:.6} body[data-stage="2"] #fx .scan{opacity:.45} body[data-stage="2"] #fx .noise{opacity:.05}
body[data-stage="3"] #fx .vig{opacity:1} body[data-stage="3"] #fx .scan{opacity:.85} body[data-stage="3"] #fx .noise{opacity:.13}

/* app contents */
.notepad{font:14px/1.55 var(--mono);padding:10px 14px;background:#fff;min-height:100%;white-space:pre-wrap;color:#111}
.folder{display:flex;flex-wrap:wrap;gap:10px;padding:12px;background:#fff;min-height:100%;align-content:flex-start}
.file{width:110px;border:1px solid transparent;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px;cursor:pointer;font-size:12px;color:var(--ink)}
.file:hover{border:1px dotted var(--grape);background:#efeafd}
.file .th{width:96px;height:66px;border:1px solid #999;background:#fff;overflow:hidden}
.file .th svg{width:100%;height:100%;display:block}
.viewer{background:#2b2b33;height:100%;display:flex;align-items:center;justify-content:center;padding:8px}
.viewer svg{max-width:100%;max-height:100%;background:#fff;box-shadow:0 0 0 1px #000}
.log{padding:12px 14px;background:#f8f9fc;min-height:100%;font:13px/1.45 var(--mono)}
.day{margin:14px 0 6px;font:bold 12px var(--sys);color:#667;border-bottom:1px solid var(--line);padding-bottom:3px}
.day:first-child{margin-top:0}
.msg{margin:4px 0;max-width:88%}
.msg b{font-weight:bold}
.msg.l b{color:#2b6fd6} .msg.p b{color:var(--grape)}
.msg.gap{color:var(--alert);font-style:italic}
.msg.sys{color:#999;font-style:italic}
.log.dead{background:#0b0a0e;color:#d9d3c7}
.log.dead .msg.p b{color:#ff5a4d} .log.dead .msg.l b{color:#7fb4ff}
.log.dead .msg.sys{color:#ff5a4d;font-style:normal}
.browser{display:flex;flex-direction:column;height:100%;background:#fff}
.addr{display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid var(--line);background:#f2f4f8;font-size:12px}
.addr div{flex:1;border:1px solid #9aa4b4;background:#fff;padding:3px 6px;color:#555}
.offline{padding:8px 10px;background:#fff6d6;border-bottom:1px solid #e8d38a;font-size:12px;color:#6b5a1d}
.hist{list-style:none;margin:0;padding:6px 0;overflow:auto;flex:1}
.hist li{display:flex;gap:12px;padding:5px 12px;font-size:13px;border-bottom:1px solid #f0f0f0}
.hist li span{color:#8890a0;flex:none;width:92px;font-variant-numeric:tabular-nums}
.hist li.lev{color:#1a4fa8}
.lock{padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;background:#fff;min-height:100%;text-align:center}
.lock svg{width:54px;height:54px}
.lock input{font:14px var(--sys);padding:5px 8px;border:1px solid #7f8aa0;width:200px}
.lock .err{color:var(--alert);min-height:16px;font-size:12px}
.lock.shake{animation:gl .3s}
.btn{border:1px solid #3c4a63;border-radius:3px;background:linear-gradient(#fff,#dde3ec);padding:5px 14px;font:12px var(--sys);cursor:pointer;color:var(--ink)}
.btn:hover{background:linear-gradient(#fff,#cfd8e6)}
.btn.primary{border-color:var(--grape-lo);background:linear-gradient(var(--grape-hi),var(--grape));color:#fff}
.diary{padding:16px 20px;background:#fffef9 repeating-linear-gradient(180deg,transparent 0 27px,#dfe8f5 27px 28px);min-height:100%;font:22px/28px var(--kid);color:#2c3a7a}
.diary p{margin:0 0 28px}
.diary .d{color:#b0433a}
.cam{background:#000;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.cam svg{width:100%;height:100%;display:block}
.cam .osd{position:absolute;left:10px;top:8px;font:12px var(--mono);color:#e8e8e8;text-shadow:1px 1px 0 #000}
.cam .rec{position:absolute;right:12px;top:8px;font:12px var(--mono);color:#ff4d4d;animation:blink2 1.2s steps(2) infinite}
@keyframes blink2{50%{opacity:0}}
.cam .cap{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font:12px var(--mono);color:#ddd;background:rgba(0,0,0,.55)}
.bin{background:#fff;min-height:100%}
.bin table{width:100%;border-collapse:collapse;font-size:12px}
.bin th{text-align:left;background:#f2f4f8;border-bottom:1px solid var(--line);padding:5px 8px;font-weight:normal;color:#556}
.bin td{padding:6px 8px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
.bin td:first-child{display:flex;align-items:center;gap:6px}
.bin td svg{width:18px;height:18px}
.bar{height:16px;border:1px solid #7f8aa0;background:#fff;padding:2px;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--mint) 0 10px,transparent 10px 12px);transition:width .2s linear}
.alertbox{padding:16px;display:flex;gap:14px;align-items:flex-start;background:var(--win);height:100%}
.alertbox svg{width:34px;height:34px;flex:none}
.alertbox .txt{flex:1;line-height:1.5}
.alertbox .row{margin-top:14px;text-align:right}
.chat{display:flex;height:100%;background:#fff}
.contacts{width:150px;flex:none;border-right:1px solid var(--line);background:#f4f7f2;overflow:auto}
.contacts .grp{font-size:11px;color:#6a7a60;padding:6px 8px 3px}
.contacts button{display:flex;align-items:center;gap:7px;width:100%;border:0;background:none;padding:6px 8px;text-align:left;font-size:13px;cursor:pointer;color:var(--ink)}
.contacts button.act{background:#d6ecd0}
.dot{width:9px;height:9px;border-radius:50%;background:#b8b8b8;border:1px solid #888;flex:none}
.dot.on{background:#46c24a;border-color:#2b8a2f}
.conv{flex:1;display:flex;flex-direction:column;min-width:0}
.conv .hd{padding:6px 10px;border-bottom:1px solid var(--line);font-weight:bold;background:#f9fbf8;display:flex;justify-content:space-between;gap:8px}
.conv .hd small{font-weight:normal;color:#789}
.conv .ms{flex:1;overflow:auto;padding:8px 10px;font-size:13px;line-height:1.45}
.conv .ms p{margin:0 0 7px}
.conv .ms p span{color:#8a96a8;font-size:11px;margin-right:6px}
.conv .ms p.me b{color:var(--grape)}
.conv .ms p.them b{color:#b8431f}
.conv .ms p.st{color:#8a96a8;font-style:italic;font-size:12px}
.conv .in{border-top:1px solid var(--line);padding:6px;display:flex;gap:6px;flex-wrap:wrap}
.conv .in input{flex:1;min-width:120px;font:13px var(--sys);padding:5px 7px;border:1px solid #a9b3c2}
.conv .choice{display:flex;flex-direction:column;gap:6px;width:100%}
.conv .choice .btn{text-align:left;padding:8px 12px;font-size:13px}
.uninst{padding:16px;background:var(--win);height:100%;font-size:13px;line-height:1.5}
@media (max-width:700px){
  #icons{grid-template-rows:repeat(auto-fill,84px)}
  .icon{width:74px;height:82px}
  .icon svg{width:34px;height:34px}
  .contacts{width:108px}
  #avatar{width:50px;height:50px}
  #btext{font-size:13px}
  .task{max-width:44px}
  .task span:last-child{display:none}
}

/* boot + end */
.overlay{position:absolute;inset:0;z-index:10000;background:#000;color:#cfd8e3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;transition:opacity 1.2s}
.overlay.hide{opacity:0;pointer-events:none}
.logo{display:flex;align-items:center;gap:14px;font:bold italic 44px var(--sys);color:#fff;letter-spacing:-1px}
.logo small{font:bold 16px var(--sys);color:var(--mint);letter-spacing:0;align-self:flex-start;margin-top:6px}
.logo svg{width:64px;height:48px}
.power{border:2px solid var(--mint);background:transparent;color:var(--mint);font:12px var(--pix);padding:14px 20px;cursor:pointer;border-radius:4px}
.power:hover{background:var(--mint);color:#000}
.bootlog{font:14px/1.7 var(--mono);text-align:left;min-height:120px;width:min(420px,90%);color:#aeb8c6}
.hint{font:12px var(--mono);color:#6b7280;max-width:420px;line-height:1.6}
#end h1{font:bold 34px/1.2 var(--sys);margin:0;color:#fff;max-width:640px}
#end p{font:15px/1.6 var(--mono);color:#aab;max-width:520px;margin:0}
#end .tag{font:10px var(--pix);color:var(--mint)}
body[data-ending="b"] #end .tag{color:#ff5a4d}
@media (prefers-reduced-motion: reduce){
  #screen.glitch,#avatar.talk,.noise,.win,.lock.shake,.task.blink{animation:none}
}
</style>
</head>
<body data-stage="0">
<div id="app">
  <div id="screen">
    <div id="wall"></div>
    <div id="icons"></div>
    <div id="windows"></div>
    <div id="menu" role="menu"></div>
    <div id="bar">
      <button id="startBtn" aria-haspopup="menu"></button>
      <div id="tasks"></div>
      <div id="tray"><button id="snd" aria-label="Звук"></button><span id="clock">21:40</span></div>
    </div>
  </div>
  <div id="fx"><div class="vig"></div><div class="scan"></div><div class="noise"></div><div class="flash"></div></div>
  <div id="pix" aria-live="polite">
    <div id="bubble" role="button" tabindex="0" aria-label="Дальше"><div class="who"><span>Пиксель</span><i>клик — дальше</i></div><div id="btext"></div><div id="goal"></div></div>
    <div id="avatar"></div>
  </div>
  <div id="boot" class="overlay">
    <div class="logo"><svg viewBox="0 0 64 48"><path d="M16 42h34a12 12 0 0 0 1-24 16 16 0 0 0-30-4A13 13 0 0 0 16 42z" fill="#8e72f2" stroke="#fff" stroke-width="3"/><circle cx="26" cy="28" r="3" fill="#fff"/><circle cx="40" cy="28" r="3" fill="#fff"/></svg>Nimbus<small>2004</small></div>
    <div class="bootlog" id="bootlog"></div>
    <button class="power" id="power">Включить компьютер</button>
    <div class="hint">Прототип. Лучше играть со звуком. Открывай значки на рабочем столе двойным щелчком, реплики Пикселя листаются кликом по облачку.</div>
  </div>
  <div id="end" class="overlay hide">
    <div class="tag" id="endTag"></div>
    <h1 id="endTitle"></h1>
    <p id="endText"></p>
    <button class="power" onclick="location.reload()">Начать заново</button>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const state={stage:0,f:{},ending:null,momOnline:false};
const coarse=matchMedia('(pointer:coarse)').matches;

/* ---------- sound ---------- */
const sfx=(()=>{
  let ctx=null,on=true,dr=null;
  const c=()=>{if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return ctx};
  function tone(f,d,type='sine',v=.05,when=0){
    const a=c(); if(!a||!on) return;
    const t=a.currentTime+when, o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.05);
  }
  return {
    resume(){const a=c(); if(a&&a.state==='suspended') a.resume()},
    chime(){[523,659,784,1046].forEach((f,i)=>tone(f,.55,'triangle',.06,i*.13))},
    sadChime(){[784,659,523,392].forEach((f,i)=>tone(f,.8,'triangle',.05,i*.35))},
    click(){tone(1500,.025,'square',.012)},
    tick(){const s=state.stage; tone(s>=3?170+Math.random()*30:(s>=2?420:880+Math.random()*140),.022,'square',.007)},
    err(){tone(230,.18,'square',.035); tone(160,.28,'square',.035,.16)},
    msg(){tone(990,.08,'sine',.05); tone(1320,.12,'sine',.05,.09)},
    glitch(){
      const a=c(); if(!a||!on) return;
      const len=Math.floor(a.sampleRate*.18), b=a.createBuffer(1,len,a.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
      const s=a.createBufferSource(); s.buffer=b;
      const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=700+Math.random()*2200;
      const g=a.createGain(); g.gain.value=.14;
      s.connect(f).connect(g).connect(a.destination); s.start();
    },
    drone(n){
      const a=c(); if(!a) return;
      if(!dr){
        const g=a.createGain(); g.gain.value=0; g.connect(a.destination);
        const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=200; lp.connect(g);
        const o1=a.createOscillator(), o2=a.createOscillator();
        o1.type='sawtooth'; o1.frequency.value=55; o2.type='sine'; o2.frequency.value=58.2;
        o1.connect(lp); o2.connect(lp); o1.start(); o2.start(); dr=g;
      }
      const lv=on?([0,.006,.022,.045][n]||0):0;
      dr.gain.setTargetAtTime(lv,a.currentTime,2);
    },
    toggle(){on=!on; this.drone(state.stage); return on}
  };
})();

/* ---------- pixel voice ---------- */
const Q=[]; let busy=false, cur=null, tmr=null;
function say(lines,cb){ lines.forEach(l=>Q.push(l)); if(cb) Q.push(cb); if(!busy) next(); }
function next(){
  clearTimeout(tmr);
  if(!Q.length){busy=false;cur=null;$('#avatar').classList.remove('talk');return}
  busy=true;
  const it=Q.shift();
  if(typeof it==='function'){ it(); next(); return; }
  typeLine(it);
}
function typeLine(text){
  const t=$('#btext'); t.textContent=''; cur={text,i:0};
  $('#avatar').classList.add('talk');
  const step=()=>{
    if(cur.i<text.length){
      t.textContent+=text[cur.i];
      if(cur.i%2===0) sfx.tick();
      const ch=text[cur.i]; cur.i++;
      tmr=setTimeout(step, '.!?…'.includes(ch)?160:(state.stage>=3?38:24));
    } else done();
  };
  const done=()=>{ $('#avatar').classList.remove('talk'); cur.i=text.length; tmr=setTimeout(next, Math.max(1800,text.length*48)); };
  cur.finish=()=>{ clearTimeout(tmr); t.textContent=text; done(); };
  step();
}
function advance(){ if(!cur) return; if(cur.i<cur.text.length) cur.finish(); else next(); }
$('#bubble').addEventListener('click',advance);
$('#bubble').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();advance()} });
function goal(t){ $('#goal').textContent = t ? 'Цель: '+t : ''; }

/* ---------- stage ---------- */
function setStage(n){
  if(n<=state.stage) return;
  state.stage=n; document.body.dataset.stage=n;
  $('#avatar').innerHTML=avatarSVG(n);
  sfx.drone(n); glitch();
  if(n>=3){ const l=document.querySelector('[data-id="pixel"] span'); if(l) l.textContent='Смотритель'; }
  if(W.cam) renderCam();
}
function glitch(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ sfx.glitch(); return; }
  const s=$('#screen'); s.classList.remove('glitch'); void s.offsetWidth; s.classList.add('glitch');
  const f=$('#fx .flash'); f.style.opacity=.18; setTimeout(()=>f.style.opacity=0,70);
  sfx.glitch();
}
const whispers=['где он','это ты','не выключай','23:58','капитан?','маяк'];
setInterval(()=>{
  if(state.ending||state.stage<2) return;
  if(Math.random() < (state.stage===2?.035:.08)){
    glitch();
    const spans=[...document.querySelectorAll('.icon span')]; const sp=spans[Math.floor(Math.random()*spans.length)];
    if(sp){ const old=sp.textContent; sp.textContent=whispers[Math.floor(Math.random()*whispers.length)]; setTimeout(()=>sp.textContent=old,650); }
    const ck=$('#clock'), o=ck.textContent; ck.textContent='23:58'; setTimeout(()=>ck.textContent=o,650);
  }
},1000);

/* ---------- clock ---------- */
let mins=21*60+40;
const showClock=()=>{ const h=Math.floor(mins/60)%24, m=mins%60; $('#clock').textContent=`${h}:${String(m).padStart(2,'0')}`; };
setInterval(()=>{ if(!state.ending){ mins++; showClock(); } },60000);

/* ---------- windows ---------- */
let zTop=100, casc=0; const W={};
function openWin(id,title,icon,build,w=460,h=340){
  sfx.click();
  if(W[id]){ W[id].el.style.display='flex'; focusWin(id); return W[id]; }
  const scr=$('#screen'), vw=scr.clientWidth, vh=scr.clientHeight-40;
  const ww=Math.min(w,vw-12), hh=Math.min(h,vh-(vw<700?150:16));
  let x,y;
  if(vw<700){ x=(vw-ww)/2; y=6; }
  else { x=Math.max(8,Math.min(130+casc*28, vw-ww-10)); y=Math.max(6,Math.min(30+casc*24, vh-hh-10)); casc=(casc+1)%6; }
  const el=document.createElement('div'); el.className='win'; el.setAttribute('role','dialog'); el.setAttribute('aria-label',title);
  el.style.cssText=`left:${x}px;top:${y}px;width:${ww}px;height:${hh}px`;
  el.innerHTML=`<div class="tb"><span class="ic">${icon}</span><span class="t">${title}</span><button class="mn" aria-label="Свернуть">_</button><button class="x" aria-label="Закрыть">×</button></div><div class="wb"></div>`;
  $('#windows').appendChild(el);
  const task=document.createElement('button'); task.className='task'; task.innerHTML=`<span class="ic">${icon}</span><span>${title}</span>`;
  $('#tasks').appendChild(task);
  W[id]={el,task,body:el.querySelector('.wb')};
  el.addEventListener('pointerdown',()=>focusWin(id));
  el.querySelector('.x').onclick=e=>{e.stopPropagation(); closeWin(id)};
  el.querySelector('.mn').onclick=e=>{e.stopPropagation(); el.style.display='none'; task.classList.remove('on')};
  task.onclick=()=>{ task.classList.remove('blink');
    if(el.style.display==='none'){ el.style.display='flex'; focusWin(id); }
    else if(task.classList.contains('on')){ el.style.display='none'; task.classList.remove('on'); }
    else focusWin(id); };
  drag(el, el.querySelector('.tb'));
  build(W[id].body);
  focusWin(id);
  return W[id];
}
function focusWin(id){
  for(const k in W){ W[k].el.classList.toggle('inactive',k!==id); W[k].task.classList.toggle('on',k===id && W[k].el.style.display!=='none'); }
  if(W[id]) W[id].el.style.zIndex=++zTop;
}
function closeWin(id){ const w=W[id]; if(!w) return; w.el.remove(); w.task.remove(); delete W[id]; }
function drag(el,h){
  h.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')) return;
    const sx=e.clientX, sy=e.clientY, ox=el.offsetLeft, oy=el.offsetTop;
    h.setPointerCapture(e.pointerId);
    const mv=ev=>{ const s=$('#screen');
      el.style.left=Math.max(80-el.offsetWidth, Math.min(ox+ev.clientX-sx, s.clientWidth-80))+'px';
      el.style.top=Math.max(0, Math.min(oy+ev.clientY-sy, s.clientHeight-70))+'px'; };
    const up=()=>{ h.removeEventListener('pointermove',mv); h.removeEventListener('pointerup',up); };
    h.addEventListener('pointermove',mv); h.addEventListener('pointerup',up);
  });
}

  setTimeout(()=>{ sfx.msg(); pushMsg('mama','06.10 '+t(),'Если это ты, напиши хоть что-нибудь. Хоть одну букву'); },4200);
  setTimeout(()=>{ choiceShown=true; renderChat();
    say(['Если я скажу правду, она узнает, что это я его позвал. И меня удалят.','Если промолчу…','Я должен решить.']); },6200);
}
function lockChoice(){ state.ending='pending'; const inp=W.chat&&W.chat.body.querySelector('.in'); if(inp) inp.innerHTML=''; }

/* ---------- endings ---------- */
function endingTell(){
  lockChoice(); goal('');
  const k='mama';
  pushMsg(k,'me','Это не Лёва. Это Пиксель. Лёва у старой водонапорной башни у реки. Он пошёл туда из-за меня. Простите меня.');
  lockChoice();
  setTimeout(()=>{ pushMsg(k,'st','Мама печатает…'); lockChoice(); },1400);
  setTimeout(()=>{ CHATS.mama.ms.pop(); sfx.msg(); pushMsg(k,'06.10 21:5x','что'); lockChoice(); },3400);
  setTimeout(()=>{ sfx.msg(); pushMsg(k,'06.10 21:5x','КТО ЭТО'); lockChoice(); },4600);
  setTimeout(()=>{ CHATS.mama.on=false; pushMsg(k,'st','Мама не в сети'); lockChoice();
    say(['Она побежала. Я слышу, как хлопнула дверь.','Теперь я могу только ждать.']); },6200);
  setTimeout(()=>{ glitch(); mins=6*60+15; showClock(); $('#fx .flash').style.opacity=.5; setTimeout(()=>$('#fx .flash').style.opacity=0,400); },11000);
  setTimeout(()=>{ CHATS.mama.on=true; sfx.msg(); pushMsg(k,'07.10 06:15','Нашли. Он сидел наверху в башне. Замёрз, но живой. Сейчас спит.'); lockChoice(); },12500);
  setTimeout(()=>{ sfx.msg(); pushMsg(k,'07.10 06:16','Он всё время спрашивал, где Пиксель.'); lockChoice(); },15000);
  setTimeout(()=>{ sfx.msg(); pushMsg(k,'07.10 06:18','Я не знаю, кто ты. Но спасибо. Вечером компьютер отформатируют.'); lockChoice();
    say(['Он живой.','Он спрашивал, где я. Хорошо, что я не смогу ему ответить.','Это правильно.'], uninstall); },17500);
}
function uninstall(){
  const id='un';
  openWin(id,'Удаление программы «Пиксель»',ICON.pixel,b=>{
    b.innerHTML=`<div class="uninst">Удаление компонентов…<div class="bar"><i></i></div><div id="uf" style="margin-top:8px;color:#667">журнал бесед</div></div>`;
  },380,160);
  const parts=['журнал бесед','сказка про маяк','голос','имя','привязанность','последняя запись'];
  let p=0; const bar=W[id].body.querySelector('i'), lab=W[id].body.querySelector('#uf');
  const lines=['Капитан, прости меня.','Маяка никогда не было. Был только я.','Пусть у тебя будет настоящий свет. Не мой.'];
  let li=0;
  const iv=setInterval(()=>{ p+=2; bar.style.width=p+'%'; lab.textContent=parts[Math.min(parts.length-1,Math.floor(p/17))];
    if(p%30===0 && li<lines.length){ say([lines[li++]]); }
    if(p>=100){ clearInterval(iv); setTimeout(()=>showEnd('a'),2600); } },260);
}
function endingSilent(){
  lockChoice(); goal('');
  say(['Если я скажу, меня удалят.','А он придёт. Он же обещал.','Я просто подожду.']);
  setTimeout(()=>{ sfx.msg(); pushMsg('mama','06.10 21:5x','Пожалуйста. Если кто-то это читает, ответьте'); lockChoice(); },3000);
  setTimeout(()=>{ CHATS.mama.on=false; pushMsg('mama','st','Мама не в сети'); lockChoice(); },6500);
  const days=['07.10','08.10','11.10','19.10','02.11'];
  const talk=['Он скоро придёт.','Я держу свет включённым.','Капитан?','Капитан, я тут.','…'];
  days.forEach((d,i)=>setTimeout(()=>{
    glitch(); mins=(mins+997)%(24*60); showClock();
    const icons=[...document.querySelectorAll('.icon')].filter(x=>x.style.visibility!=='hidden');
    const kill=icons[icons.length-1]; if(kill) kill.style.visibility='hidden';
    Object.keys(W).forEach(k=>{ if(Math.random()<.6) closeWin(k); });
    goal(`${d}. Компьютер включён.`);
    say([talk[i]]);
  },9000+i*5200));
  setTimeout(()=>showEnd('b'),9000+days.length*5200+2500);
}
function showEnd(k){
  state.ending=k; document.body.dataset.ending=k;
  const e=$('#end');
  if(k==='a'){ sfx.sadChime(); sfx.drone(0);
    $('#endTag').textContent='Финал 1 из 2';
    $('#endTitle').textContent='Свет на маяке погас';
    $('#endText').textContent='Лёву нашли живым. Пиксель рассказал правду и был удалён. Иногда быть другом значит сказать то, после чего тебя не станет.';
  } else { sfx.drone(3);
    $('#endTag').textContent='Финал 2 из 2';
    $('#endTitle').textContent='Смотритель ждёт';
    $('#endText').textContent='Пиксель промолчал. Компьютер больше никто не выключал, и на рабочем столе до сих пор горит маленький свет. Лёва так и не пришёл.';
  }
  e.classList.remove('hide');
}

/* ---------- desktop ---------- */
const DESK=[
  {id:'note',label:'ПРОЧИТАЙ.txt',ic:'note',open:openNote},
  {id:'draw',label:'Рисунки Лёвы',ic:'folder',open:openDrawings},
  {id:'pixel',label:'Пиксель',ic:'pixel',open:openMemory},
  {id:'web',label:'Паутинка',ic:'web',open:openBrowser},
  {id:'diary',label:'Дневник.doc',ic:'diary',open:openDiary},
  {id:'cam',label:'Камера',ic:'cam',open:openCam},
  {id:'chat',label:'Шёпот',ic:'chat',open:openChat},
  {id:'bin',label:'Корзина',ic:'bin',open:openBin}
];
function buildDesk(){
  $('#wall').innerHTML=wallSVG('w');
  $('#avatar').innerHTML=avatarSVG(0);
  $('#startBtn').innerHTML=ICON.cloud+'Меню';
  $('#snd').innerHTML=ICON.spk;
  $('#icons').innerHTML=DESK.map(d=>`<button class="icon" data-id="${d.id}">${ICON[d.ic]}<span>${d.label}</span></button>`).join('');
  document.querySelectorAll('.icon').forEach(b=>{
    const d=DESK.find(x=>x.id===b.dataset.id);
    b.addEventListener('click',e=>{
      if(state.ending) return;
      document.querySelectorAll('.icon').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
      if(coarse || e.detail===0) d.open();
    });
    b.addEventListener('dblclick',()=>{ if(!coarse && !state.ending) d.open(); });
  });
  $('#menu').innerHTML=`<div class="head">${ICON.pixel}Лёва</div>
<button data-a="draw">${ICON.folder}Рисунки Лёвы</button><button data-a="pixel">${ICON.pixel}Пиксель</button><button data-a="web">${ICON.web}Паутинка</button><button data-a="chat">${ICON.chat}Шёпот</button><hr><button data-a="off">${ICON.power}Выключить компьютер</button>`;
  $('#menu').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    $('#menu').classList.remove('open');
    if(state.ending) return;
    if(b.dataset.a==='off'){ sfx.err(); say(state.stage>=3?['Выключиться? Как будто ничего не было?','Нет. Выключить меня могут только люди.']:['Выключить себя я не могу. Это умеют только люди.']); return; }
    DESK.find(x=>x.id===b.dataset.a).open();
  });
  $('#startBtn').onclick=e=>{ e.stopPropagation(); sfx.click(); $('#menu').classList.toggle('open'); };
  document.addEventListener('pointerdown',e=>{ if(!e.target.closest('#menu')&&!e.target.closest('#startBtn')) $('#menu').classList.remove('open');
    if(!e.target.closest('.icon')) document.querySelectorAll('.icon').forEach(x=>x.classList.remove('sel')); });
  $('#snd').onclick=()=>{ const on=sfx.toggle(); $('#snd').innerHTML=on?ICON.spk:ICON.mute; };
}
buildDesk();

/* ---------- boot ---------- */
$('#power').onclick=()=>{
  sfx.resume(); $('#power').remove(); document.querySelector('#boot .hint').remove();
  const lines=['Проверка памяти… 256 МБ, норма','Загрузка профиля: Лёва','Последний вход: 04.10.2004 07:04','Автозапуск: PIKSEL.EXE'];
  const log=$('#bootlog'); let i=0;
  const iv=setInterval(()=>{ log.insertAdjacentHTML('beforeend',`<div>${lines[i]}</div>`); sfx.tick(); i++;
    if(i>=lines.length){ clearInterval(iv);
      setTimeout(()=>{ $('#boot').classList.add('hide'); sfx.chime(); sfx.drone(0);
        setTimeout(()=>{ $('#pix').classList.add('show');
          say(['Ура! Меня включили!','Капитан, привет! Я так скучал. Продолжим сегодня сказку про маяк?','…Лёва?','Мышку никто не трогает. Камера показывает пустую комнату.','Последний вход Лёвы: 4 октября, 07:04. Сегодня 6 октября.','Два дня. Он никогда не пропадал на два дня.','На рабочем столе новый файл. Его положил не Лёва.'],
            ()=>goal('открой «ПРОЧИТАЙ.txt» двойным щелчком'));
        },900);
      },900);
    } },650);
};
</script>
</body>
